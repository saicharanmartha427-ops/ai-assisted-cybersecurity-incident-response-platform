openapi: 3.0.3
info:
  title: AI-Assisted Cybersecurity Incident Response Platform API
  version: 2.0.0
servers:
  - url: http://localhost:5000
  /api/ai/status:
    get:
      summary: Get Generative AI provider configuration status
      description: Reports whether an LLM API key is configured without returning secrets. Deterministic detection remains active regardless of LLM availability.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Provider configuration status
        '401':
          description: Authentication required

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /api/health:
    get:
      summary: Health check
      responses: {"200": {description: Healthy}}
  /api/auth/login:
    post:
      summary: Login
      responses: {"200": {description: JWT token}, "401": {description: Invalid credentials}}
  /api/dashboard:
    get:
      security: [{bearerAuth: []}]
      summary: Dashboard analytics
      responses: {"200": {description: Dashboard metrics}}
  /api/events:
    post:
      security: [{bearerAuth: []}]
      summary: Create a manual security event
      responses: {"201": {description: Event accepted}}
  /api/analyze:
    post:
      security: [{bearerAuth: []}]
      summary: Analyze CSV telemetry
      responses: {"200": {description: Analysis results}}
  /api/incidents:
    get:
      security: [{bearerAuth: []}]
      summary: List incidents
      responses: {"200": {description: Incidents}}
  /api/incidents/{id}/actions:
    post:
      security: [{bearerAuth: []}]
      summary: Execute response action
      responses: {"200": {description: Response executed}}
  /api/playbooks:
    get:
      security: [{bearerAuth: []}]
      summary: List playbooks
      responses: {"200": {description: Playbooks}}
  /api/reports:
    get:
      security: [{bearerAuth: []}]
      summary: List reports
      responses: {"200": {description: Reports}}
